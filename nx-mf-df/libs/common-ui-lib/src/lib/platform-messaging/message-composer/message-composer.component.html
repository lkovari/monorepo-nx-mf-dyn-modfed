<form
  class="flex flex-col gap-2 min-w-[min(100vw-2rem,22rem)] text-sm"
  [formGroup]="form"
  (ngSubmit)="submit()"
>
  <div class="flex flex-col gap-0.5">
    <label class="text-xs font-medium text-slate-700" for="composer-source"
      >Source</label
    >
    <input
      pInputText
      class="w-full"
      id="composer-source"
      type="text"
      formControlName="source"
      autocomplete="off"
    />
  </div>
  <div class="flex flex-col gap-0.5">
    <label class="text-xs font-medium text-slate-700" for="composer-kind"
      >Kind</label
    >
    <p-select
      formControlName="kind"
      inputId="composer-kind"
      class="w-full"
      [options]="kindOptions"
      optionLabel="label"
      optionValue="value"
    ></p-select>
    @if (form.hasError('unsupportedKind')) {
      <p class="text-sm text-amber-700">
        Only event messages are supported in this composer.
      </p>
    }
  </div>
  <div class="flex flex-col gap-0.5">
    <label class="text-xs font-medium text-slate-700" for="composer-sensitivity"
      >Sensitivity</label
    >
    <p-select
      formControlName="sensitivity"
      inputId="composer-sensitivity"
      class="w-full"
      [options]="sensitivityOptions"
      optionLabel="label"
      optionValue="value"
    ></p-select>
  </div>
  <div class="flex flex-col gap-0.5">
    <label class="text-xs font-medium text-slate-700" for="composer-target"
      >Target</label
    >
    <p-select
      formControlName="target"
      inputId="composer-target"
      class="w-full"
      [options]="targetOptions()"
      optionLabel="label"
      optionValue="value"
    ></p-select>
  </div>
  <div class="flex flex-col gap-0.5">
    <label class="text-xs font-medium text-slate-700" for="composer-severity"
      >Severity</label
    >
    <p-select
      formControlName="severity"
      inputId="composer-severity"
      class="w-full"
      [options]="severityOptions"
      optionLabel="label"
      optionValue="value"
    ></p-select>
  </div>
  <div class="flex flex-col gap-0.5">
    <label class="text-xs font-medium text-slate-700" for="composer-title"
      >Title</label
    >
    <input
      pInputText
      class="w-full"
      id="composer-title"
      type="text"
      formControlName="title"
      autocomplete="off"
    />
  </div>
  <div class="flex flex-col gap-0.5">
    <label class="text-xs font-medium text-slate-700" for="composer-body"
      >Body</label
    >
    <textarea
      pTextarea
      class="w-full min-h-[3rem] max-h-[8rem] resize-y text-sm leading-snug"
      id="composer-body"
      formControlName="body"
    ></textarea>
  </div>
  <div class="flex justify-end gap-2 pt-1">
    <p-button
      type="button"
      label="Cancel"
      severity="secondary"
      (onClick)="cancel()"
    ></p-button>
    <p-button
      type="submit"
      label="Send"
      [disabled]="form.invalid || !bridgeAvailable()"
    ></p-button>
  </div>
</form>
